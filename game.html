<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Minesweeper - Xếp Hạng Chuẩn</title>
    <style>
        /* --- GIAO DIỆN DARK MODE --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #23272a; 
            color: white; margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            user-select: none;
        }

        .main-container {
            display: flex; flex-direction: row; gap: 40px; padding: 20px;
            max-width: 1200px; width: 100%;
        }

        /* CỘT TRÁI: GAME */
        .game-section { flex: 2; display: flex; flex-direction: column; align-items: center; }
        h1 { margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 3px; font-size: 2.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .controls { margin-bottom: 20px; display: flex; gap: 15px; }
        .badge { 
            background: #2c3e50; padding: 10px 15px; border-radius: 8px; 
            font-weight: bold; border: 1px solid #444; min-width: 80px; text-align: center;
        }
        .btn-restart { 
            padding: 10px 20px; background-color: #e74c3c; color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; 
        }
        .btn-restart:hover { background-color: #c0392b; transform: scale(1.05); }

        /* BÀN CỜ */
        .board-container {
            background-color: #2c3e50; padding: 20px; border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: grid; grid-template-columns: 30px auto; grid-template-rows: 30px auto;
        }
        .coord-top, .coord-left { color: #95a5a6; font-weight: bold; display: grid; }
        .coord-top { grid-column: 2; grid-row: 1; grid-template-columns: repeat(9, 45px); margin-bottom: 5px;}
        .coord-left { grid-column: 1; grid-row: 2; grid-template-rows: repeat(9, 45px); margin-right: 5px;}
        .coord-letter, .coord-number { display: flex; justify-content: center; align-items: center; }

        #grid {
            grid-column: 2; grid-row: 2;
            display: grid; grid-template-columns: repeat(9, 45px); grid-template-rows: repeat(9, 45px);
            border: 2px solid #555; background-color: #34495e; gap: 2px;
        }

        .cell {
            width: 45px; height: 45px; background-color: #2c3e50;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .cell:hover { background-color: #3e5871; }
        .cell.revealed { background-color: #ecf0f1; cursor: default; }
        
        .num-1 { color: #2980b9; } .num-2 { color: #27ae60; } .num-3 { color: #c0392b; } .num-4 { color: #8e44ad; }
        .cell.bomb-defused { background-color: #27ae60; color: white; }
        .cell.bomb-exploded { background-color: #c0392b; color: white; }
        .cell.flagged { color: #e74c3c; font-size: 24px;}

        /* CỘT PHẢI: BẢNG XẾP HẠNG */
        .leaderboard-section {
            flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid #444;
            border-radius: 15px; padding: 20px; height: fit-content; backdrop-filter: blur(10px);
        }
        .leaderboard-section h2 { text-align: center; border-bottom: 2px solid #e74c3c; padding-bottom: 10px; margin-top: 0; color: #ecf0f1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #95a5a6; padding: 10px; font-size: 0.9rem; border-bottom: 1px solid #555; }
        td { padding: 10px; border-bottom: 1px solid #444; font-size: 1rem; }
        
        /* Highlight Top 3 */
        tr:nth-child(1) td { color: #f1c40f; font-weight: bold; font-size: 1.1rem; } /* Vàng */
        tr:nth-child(2) td { color: #bdc3c7; font-weight: bold; } /* Bạc */
        tr:nth-child(3) td { color: #e67e22; font-weight: bold; } /* Đồng */

        /* Modal Chung */
        .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #ecf0f1; color: #333; width: 400px; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 0 25px rgba(255,255,255,0.1); }
        
        #start-modal { z-index: 2000; }
        input[type="text"] { padding: 12px; width: 80%; margin: 15px 0; font-size: 18px; border: 2px solid #34495e; border-radius: 5px; text-align: center; }
        .btn-start { padding: 12px 30px; background: #2980b9; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .btn-start:hover { background: #3498db; }

        .opt-btn { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 5px; font-size: 1rem; transition: 0.2s;}
        .opt-btn:hover { background: #2c3e50; color: white; }

        #result-modal { display: none; z-index: 1500; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="start-modal" class="modal">
    <div class="modal-box">
        <h1 style="color:#2c3e50; font-size: 2rem;">Nhập Tên</h1>
        <p>Để bắt đầu và ghi danh lên bảng vàng:</p>
        <input type="text" id="input-player-name" placeholder="Tên của bạn..." autocomplete="off">
        <br>
        <button class="btn-start" onclick="startGame()">VÀO GAME ▶</button>
    </div>
</div>

<div class="main-container">
    <div class="game-section">
        <h1>Dò Mìn - Sudoku</h1>
        <div class="controls">
            <div class="badge">👤 <span id="display-name">...</span></div>
            <div class="badge">⏳ <span id="timer">00:00</span></div>
            <div class="badge">💣 <span id="bomb-counter">10</span></div>
            <div class="badge">🏆 <span id="current-score">0</span></div>
            <button class="btn-restart" onclick="location.reload()">🔄 Thoát</button>
        </div>

        <div class="board-container">
            <div class="coord-top" id="coord-top"></div>
            <div class="coord-left" id="coord-left"></div>
            <div id="grid"></div>
        </div>
        <p style="color: #95a5a6; font-size: 0.9rem; margin-top: 15px;">🖱️ Trái: Mở ô | 🖱️ Phải: Cắm cờ</p>
    </div>

    <div class="leaderboard-section">
        <h2>Bảng Xếp Hạng</h2>
        <div id="loading-text" style="text-align:center;color:#777">Đang cập nhật...</div>
        <table id="score-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tên</th>
                    <th>Điểm</th>
                    <th>Thời gian</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>
</div>

<div id="quiz-modal" class="modal" style="display: none;">
    <div class="modal-box">
        <h2 style="color:#c0392b">⚠️ CÓ BOM!</h2>
        <p id="q-text" style="font-size: 1.2rem; font-weight: 500;">...</p>
        <div id="opt-container"></div>
    </div>
</div>

<div id="result-modal" class="modal">
    <div class="modal-box">
        <h2 id="result-title">...</h2>
        <p id="result-msg">Đang gửi kết quả về hệ thống...</p>
        <div id="loading-spinner" style="font-size: 30px;">⏳</div>
    </div>
</div>

<script>
    // 👇👇 THAY LINK API CỦA BẠN VÀO ĐÂY 👇👇
    const API_URL = "https://sheetdb.io/api/v1/mp81vtzu8s1qa"; 
    // 👆👆 --------------------------------- 👆👆

    const SIZE = 9;
    const BOMBS_COUNT = 10;
    let grid = [];
    let gameOver = false;
    let bombsLeft = BOMBS_COUNT;
    let userScore = 0;
    let currentBombIndex = -1;
    let playerName = "";

    // Thời gian
    let timerInterval;
    let secondsElapsed = 0;

    const questions = [
        { q: "1 + 1 = ?", a: ["2", "3", "4"], c: 0 },
        { q: "Thủ đô Việt Nam?", a: ["Huế", "Hà Nội", "Đà Nẵng"], c: 1 },
        { q: "Con gì 4 chân?", a: ["Gà", "Chó", "Cá"], c: 1 },
        { q: "Nước nào đông dân nhất?", a: ["Ấn Độ", "Mỹ", "Nga"], c: 0 }
    ];

    function startGame() {
        const inputName = document.getElementById('input-player-name').value.trim();
        if (!inputName) { alert("Bạn chưa nhập tên kìa!"); return; }
        playerName = inputName;
        document.getElementById('display-name').textContent = playerName;
        document.getElementById('start-modal').style.display = 'none';
        initGame();
    }

    function initGame() {
        const gridEl = document.getElementById('grid');
        const top = document.getElementById('coord-top');
        const left = document.getElementById('coord-left');
        
        gridEl.innerHTML = ''; top.innerHTML = ''; left.innerHTML = '';
        grid = []; gameOver = false; bombsLeft = BOMBS_COUNT; userScore = 0;
        
        stopTimer(); startTimer(); updateUI();

        ['A','B','C','D','E','F','G','H','I'].forEach(c=>top.innerHTML+=`<div class="coord-letter">${c}</div>`);
        for(let i=1; i<=SIZE; i++) left.innerHTML+=`<div class="coord-number">${i}</div>`;

        for (let i = 0; i < SIZE * SIZE; i++) {
            grid.push({ isBomb: false, isRevealed: false, isFlagged: false, neighborBombs: 0 });
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            if (i % 9 === 2 || i % 9 === 5) cell.style.borderRight = "3px solid #7f8c8d";
            if (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5) cell.style.borderBottom = "3px solid #7f8c8d";
            cell.addEventListener('mousedown', (e) => {
                if (e.button === 0) handleClick(i);
                else if (e.button === 2) handleRightClick(i);
            });
            gridEl.appendChild(cell);
        }

        let planted = 0;
        while (planted < BOMBS_COUNT) {
            let r = Math.floor(Math.random() * 81);
            if (!grid[r].isBomb) { grid[r].isBomb = true; planted++; }
        }

        for(let i=0; i<81; i++) if(!grid[i].isBomb) grid[i].neighborBombs = countNeighbors(i);
        loadLeaderboard();
    }

    // --- LOGIC THỜI GIAN ---
    function startTimer() {
        secondsElapsed = 0;
        document.getElementById('timer').textContent = "00:00";
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const s = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); }
    function getFormattedTime() {
        const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const s = (secondsElapsed % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // --- GAMEPLAY ---
    function countNeighbors(idx) {
        let count = 0; const r = Math.floor(idx/9); const c = idx%9;
        for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) {
            const nr=r+i; const nc=c+j;
            if(nr>=0 && nr<9 && nc>=0 && nc<9 && grid[nr*9+nc].isBomb) count++;
        }
        return count;
    }

    function handleClick(idx) {
        if (gameOver || grid[idx].isRevealed || grid[idx].isFlagged) return;
        if (grid[idx].isBomb) { currentBombIndex = idx; showQuiz(); }
        else { revealCell(idx); checkWin(); }
    }

    function handleRightClick(idx) {
        if (gameOver || grid[idx].isRevealed) return;
        const d = grid[idx]; const el = document.querySelector(`.cell[data-index='${idx}']`);
        d.isFlagged = !d.isFlagged;
        el.textContent = d.isFlagged ? '🚩' : '';
        el.classList.toggle('flagged');
        bombsLeft += d.isFlagged ? -1 : 1;
        updateUI();
    }

    function revealCell(idx) {
        if (idx<0 || idx>=81 || grid[idx].isRevealed || grid[idx].isFlagged) return;
        const d = grid[idx]; const el = document.querySelector(`.cell[data-index='${idx}']`);
        d.isRevealed = true; el.classList.add('revealed');
        userScore += 10; updateUI();

        if (d.neighborBombs > 0) {
            el.textContent = d.neighborBombs; el.classList.add(`num-${d.neighborBombs}`);
        } else {
            el.textContent = '';
            const r = Math.floor(idx/9); const c = idx%9;
            for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) {
                const nr=r+i; const nc=c+j;
                if(nr>=0 && nr<9 && nc>=0 && nc<9) revealCell(nr*9+nc);
            }
        }
    }

    function showQuiz() {
        const m = document.getElementById('quiz-modal');
        const qData = questions[Math.floor(Math.random()*questions.length)];
        document.getElementById('q-text').textContent = qData.q;
        const c = document.getElementById('opt-container');
        c.innerHTML = '';
        m.style.display = 'flex';
        
        qData.a.forEach((ans, i) => {
            const b = document.createElement('button'); b.className = 'opt-btn'; b.textContent = ans;
            b.onclick = () => {
                m.style.display = 'none';
                if (i === qData.c) {
                    alert("ĐÚNG! (+50 điểm)");
                    userScore += 50; 
                    const el = document.querySelector(`.cell[data-index='${currentBombIndex}']`);
                    el.classList.add('bomb-defused'); el.textContent = '😎';
                    grid[currentBombIndex].isRevealed = true;
                    updateUI(); checkWin();
                } else {
                    handleGameOver(false);
                }
            };
            c.appendChild(b);
        });
    }

    function checkWin() {
        const safeCells = 81 - BOMBS_COUNT;
        const revealedSafe = grid.filter(c => !c.isBomb && c.isRevealed).length;
        if (revealedSafe === safeCells) { handleGameOver(true); }
    }

    function handleGameOver(isWin) {
        gameOver = true; stopTimer();
        const resModal = document.getElementById('result-modal');
        const resTitle = document.getElementById('result-title');
        const resMsg = document.getElementById('result-msg');
        
        resModal.style.display = 'flex';

        if (isWin) {
            resTitle.textContent = "🎉 CHIẾN THẮNG!"; resTitle.style.color = "#27ae60";
            resMsg.textContent = `Bạn đạt ${userScore} điểm trong ${getFormattedTime()}. Đang lưu...`;
        } else {
            resTitle.textContent = "💥 BẠN ĐÃ THUA"; resTitle.style.color = "#c0392b";
            resMsg.textContent = `Điểm: ${userScore}. Đang lưu...`;
            grid.forEach((c, i) => {
                if (c.isBomb) {
                    const el = document.querySelector(`.cell[data-index='${i}']`);
                    if (!el.classList.contains('bomb-exploded')) { el.textContent = '💣'; el.style.backgroundColor = '#c0392b'; }
                } else { document.querySelector(`.cell[data-index='${i}']`).style.opacity = '0.5'; }
            });
            const bombEl = document.querySelector(`.cell[data-index='${currentBombIndex}']`);
            bombEl.classList.add('bomb-exploded'); bombEl.textContent = '💥';
        }
        submitScore();
    }

    function submitScore() {
        const data = { Ten: playerName, Diem: userScore, ThoiGian: getFormattedTime() };
        fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: data })
        }).then(() => {
            loadLeaderboard();
            setTimeout(() => {
                document.getElementById('loading-spinner').innerHTML = "✅";
                document.getElementById('result-msg').textContent = "Đã lưu điểm! F5 để người khác chơi.";
            }, 1000);
        }).catch(err => { alert("Lỗi mạng!"); document.getElementById('result-modal').style.display = 'none'; });
    }

    function updateUI() {
        document.getElementById('bomb-counter').textContent = bombsLeft;
        document.getElementById('current-score').textContent = userScore;
    }

    // --- LOGIC XẾP HẠNG (QUAN TRỌNG) ---
    async function loadLeaderboard() {
        if(API_URL.includes("xxxx")) return;
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            // THUẬT TOÁN SẮP XẾP MỚI
            data.sort((a, b) => {
                const scoreA = parseInt(a.Diem) || 0;
                const scoreB = parseInt(b.Diem) || 0;

                // 1. So sánh Điểm (Cao -> Thấp)
                if (scoreB !== scoreA) {
                    return scoreB - scoreA;
                }

                // 2. Nếu điểm bằng nhau -> So sánh Thời gian (Thấp -> Cao, tức là Nhanh hơn)
                // Hàm đổi "MM:SS" ra giây
                const timeToSec = (t) => {
                    if (!t) return 999999;
                    let parts = t.split(':');
                    return parseInt(parts[0]) * 60 + parseInt(parts[1]);
                };
                return timeToSec(a.ThoiGian) - timeToSec(b.ThoiGian);
            });

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            document.getElementById('loading-text').style.display = 'none';

            data.slice(0, 10).forEach((p, i) => {
                const row = `<tr>
                    <td>${i+1}</td>
                    <td>${p.Ten}</td>
                    <td>${p.Diem}</td>
                    <td>${p.ThoiGian||'--'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        } catch (err) { console.error(err); }
    }
    
    setInterval(loadLeaderboard, 5000);

</script>

</body>
</html>
