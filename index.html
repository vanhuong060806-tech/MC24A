<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Minesweeper Quiz - Final</title>
    <style>
        /* --- 1. CÀI ĐẶT CHUNG & HÌNH NỀN --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50; /* Màu nền tối sang trọng */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none; /* Chống bôi đen khi click nhiều */
        }

        h1 { margin: 0 0 10px 0; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button.btn-restart {
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }
        button.btn-restart:hover { background-color: #c0392b; }

        .status-box {
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.1rem;
        }

        /* --- 2. BÀN CỜ (BOARD) --- */
        .board-container {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            display: grid;
            /* Cột tọa độ (30px) + Lưới game */
            grid-template-columns: 30px auto;
            /* Hàng tọa độ (30px) + Lưới game */
            grid-template-rows: 30px auto;
        }

        /* Tọa độ chữ (A-I) */
        .coord-top {
            grid-column: 2; grid-row: 1;
            display: grid; grid-template-columns: repeat(9, 50px);
        }
        .coord-letter {
            width: 50px; height: 30px;
            display: flex; justify-content: center; align-items: center;
            color: #2c3e50; font-weight: bold;
        }

        /* Tọa độ số (1-9) */
        .coord-left {
            grid-column: 1; grid-row: 2;
            display: grid; grid-template-rows: repeat(9, 50px);
        }
        .coord-number {
            width: 30px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            color: #2c3e50; font-weight: bold;
        }

        /* LƯỚI CHÍNH */
        #grid {
            grid-column: 2; grid-row: 2;
            display: grid;
            grid-template-columns: repeat(9, 50px);
            grid-template-rows: repeat(9, 50px);
            border: 4px solid #34495e; /* Viền ngoài cùng đậm */
            background-color: #bdc3c7;
            gap: 1px;
        }

        .cell {
            width: 50px; height: 50px;
            background-color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px; font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        
        .cell:hover { background-color: #dfe6e9; }
        
        /* Kẻ lưới 3x3 Sudoku đậm */
        .cell.thick-right { border-right: 3px solid #34495e !important; }
        .cell.thick-bottom { border-bottom: 3px solid #34495e !important; }

        /* TRẠNG THÁI Ô */
        .cell.revealed { background-color: #ecf0f1; cursor: default; } /* Ô đã mở */
        .cell.flagged { color: #e74c3c; } /* Cắm cờ */
        
        /* Màu số Minesweeper chuẩn */
        .num-1 { color: #2980b9; } /* Xanh dương */
        .num-2 { color: #27ae60; } /* Xanh lá */
        .num-3 { color: #c0392b; } /* Đỏ */
        .num-4 { color: #8e44ad; } /* Tím */
        .num-5 { color: #d35400; } /* Cam */
        
        .cell.bomb-defused { background-color: #2ecc71; color: white; } /* Gỡ bom xong */
        .cell.bomb-exploded { background-color: #e74c3c; color: white; } /* Nổ */

        /* --- 3. MODAL CÂU HỎI --- */
        #modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white; color: #333;
            width: 500px; padding: 30px; border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
        
        .modal-box h2 { color: #c0392b; margin-top: 0; }
        .question-text { font-size: 1.2rem; margin: 20px 0; font-weight: 500; }
        
        .options-grid { display: grid; gap: 10px; }
        .opt-btn {
            padding: 12px; border: 2px solid #bdc3c7;
            background: white; border-radius: 6px;
            font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .opt-btn:hover { background: #34495e; color: white; border-color: #34495e; }

    </style>
</head>
<body oncontextmenu="return false;">

    <h1>Dò Mìn - Sudoku</h1>
    
    <div class="controls">
        <div class="status-box" id="status">💣 Bom còn lại: <span id="bomb-counter">10</span></div>
        <button class="btn-restart" onclick="initGame()">🔄 Chơi Lại</button>
    </div>

    <div class="board-container">
        <div class="coord-top" id="coord-top"></div>
        <div class="coord-left" id="coord-left"></div>
        
        <div id="grid"></div>
    </div>

    <div style="margin-top: 15px; font-size: 0.9rem; opacity: 0.8;">
        <i>🖱️ Chuột trái: Mở ô | 🚩 Chuột phải: Cắm cờ</i>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h2>⚠️ PHÁT HIỆN BOM!</h2>
            <p class="question-text" id="q-text">Câu hỏi ở đây...</p>
            <div class="options-grid" id="opt-container"></div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH TRÒ CHƠI ---
        const SIZE = 9;
        const BOMBS_COUNT = 10;
        let grid = [];
        let gameOver = false;
        let bombsLeft = BOMBS_COUNT;
        let currentBombIndex = -1;

        // --- DANH SÁCH CÂU HỎI (Bạn sửa ở đây) ---
        const questions = [
            { q: "1 + 1 bằng mấy?", a: ["1", "2", "3", "4"], correct: 1 },
            { q: "Thủ đô của Việt Nam?", a: ["Hà Nội", "Huế", "TP.HCM"], correct: 0 },
            { q: "Nước nào có diện tích lớn nhất?", a: ["Mỹ", "Trung Quốc", "Nga"], correct: 2 },
            { q: "Ai là người đầu tiên lên mặt trăng?", a: ["Gagarin", "Armstrong", "Elon Musk"], correct: 1 },
            { q: "Con gì càng to càng nhỏ?", a: ["Con Cua", "Con Voi", "Con Kiến"], correct: 0 } 
            // Thêm nhiều câu hỏi nữa vào đây...
        ];

        // KHỞI TẠO GAME
        function initGame() {
            const gridEl = document.getElementById('grid');
            const topCoord = document.getElementById('coord-top');
            const leftCoord = document.getElementById('coord-left');
            
            gridEl.innerHTML = '';
            topCoord.innerHTML = '';
            leftCoord.innerHTML = '';
            
            grid = [];
            gameOver = false;
            bombsLeft = BOMBS_COUNT;
            updateStatus();

            // Tạo tọa độ
            ['A','B','C','D','E','F','G','H','I'].forEach(c => 
                topCoord.innerHTML += `<div class="coord-letter">${c}</div>`
            );
            for(let i=1; i<=SIZE; i++) 
                leftCoord.innerHTML += `<div class="coord-number">${i}</div>`;

            // Tạo ô lưới (Data + Giao diện)
            for (let i = 0; i < SIZE * SIZE; i++) {
                grid.push({
                    isBomb: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborBombs: 0
                });

                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                
                // Kẻ đậm 3x3
                const col = i % 9;
                const row = Math.floor(i / 9);
                if (col === 2 || col === 5) cell.classList.add('thick-right');
                if (row === 2 || row === 5) cell.classList.add('thick-bottom');

                // Sự kiện chuột
                cell.addEventListener('mousedown', (e) => {
                    if (e.button === 0) handleClick(i);      // Chuột trái
                    else if (e.button === 2) handleRightClick(i); // Chuột phải
                });

                gridEl.appendChild(cell);
            }

            // Rải bom ngẫu nhiên
            let planted = 0;
            while (planted < BOMBS_COUNT) {
                let r = Math.floor(Math.random() * (SIZE * SIZE));
                if (!grid[r].isBomb) {
                    grid[r].isBomb = true;
                    planted++;
                }
            }

            // Tính số bom xung quanh
            for (let i = 0; i < SIZE * SIZE; i++) {
                if (!grid[i].isBomb) {
                    grid[i].neighborBombs = countNeighbors(i);
                }
            }
        }

        // ĐẾM BOM XUNG QUANH
        function countNeighbors(idx) {
            let count = 0;
            const r = Math.floor(idx / SIZE);
            const c = idx % SIZE;
            
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const nr = r + i;
                    const nc = c + j;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                        if (grid[nr * SIZE + nc].isBomb) count++;
                    }
                }
            }
            return count;
        }

        // XỬ LÝ CLICK CHUỘT TRÁI (MỞ Ô)
        function handleClick(idx) {
            if (gameOver || grid[idx].isRevealed || grid[idx].isFlagged) return;

            const cellData = grid[idx];
            const cellEl = document.querySelector(`.cell[data-index='${idx}']`);

            if (cellData.isBomb) {
                // Dính bom -> Hiện câu hỏi
                currentBombIndex = idx;
                showQuiz();
            } else {
                revealCell(idx);
            }
        }

        // XỬ LÝ CLICK CHUỘT PHẢI (CẮM CỜ)
        function handleRightClick(idx) {
            if (gameOver || grid[idx].isRevealed) return;
            
            const cellData = grid[idx];
            const cellEl = document.querySelector(`.cell[data-index='${idx}']`);

            cellData.isFlagged = !cellData.isFlagged;
            if (cellData.isFlagged) {
                cellEl.textContent = '🚩';
                cellEl.classList.add('flagged');
                bombsLeft--;
            } else {
                cellEl.textContent = '';
                cellEl.classList.remove('flagged');
                bombsLeft++;
            }
            updateStatus();
        }

        // HÀM MỞ Ô (CÓ ĐỆ QUY LOANG)
        function revealCell(idx) {
            if (idx < 0 || idx >= SIZE*SIZE || grid[idx].isRevealed || grid[idx].isFlagged) return;

            const cellData = grid[idx];
            const cellEl = document.querySelector(`.cell[data-index='${idx}']`);
            
            cellData.isRevealed = true;
            cellEl.classList.add('revealed');

            if (cellData.neighborBombs > 0) {
                cellEl.textContent = cellData.neighborBombs;
                cellEl.classList.add(`num-${cellData.neighborBombs}`);
            } else {
                // Nếu là số 0 -> Mở rộng ra xung quanh
                cellEl.textContent = '';
                const r = Math.floor(idx / SIZE);
                const c = idx % SIZE;
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const nr = r + i;
                        const nc = c + j;
                        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                            revealCell(nr * SIZE + nc);
                        }
                    }
                }
            }
        }

        // HIỆN CÂU HỎI
        function showQuiz() {
            const modal = document.getElementById('modal');
            const qText = document.getElementById('q-text');
            const optDiv = document.getElementById('opt-container');

            // Lấy câu hỏi ngẫu nhiên
            const rand = Math.floor(Math.random() * questions.length);
            const q = questions[rand];

            qText.textContent = q.q;
            optDiv.innerHTML = '';

            q.a.forEach((ans, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = ans;
                btn.onclick = () => checkAnswer(i, q.correct, modal);
                optDiv.appendChild(btn);
            });

            modal.style.display = 'flex';
        }

        // KIỂM TRA ĐÁP ÁN
        function checkAnswer(chosen, correct, modal) {
            modal.style.display = 'none';
            const cellEl = document.querySelector(`.cell[data-index='${currentBombIndex}']`);
            
            if (chosen === correct) {
                // Đúng -> Gỡ bom
                alert("Chính xác! Bom đã được gỡ.");
                cellEl.classList.add('bomb-defused');
                cellEl.textContent = '😎';
                grid[currentBombIndex].isRevealed = true;
            } else {
                // Sai -> Nổ
                alert("Sai rồi! BÙM!");
                cellEl.classList.add('bomb-exploded');
                cellEl.textContent = '💥';
                revealAllBombs();
                gameOver = true;
            }
        }

        function revealAllBombs() {
            grid.forEach((c, i) => {
                if (c.isBomb) {
                    const el = document.querySelector(`.cell[data-index='${i}']`);
                    if (!el.classList.contains('bomb-exploded')) {
                        el.textContent = '💣';
                        el.style.backgroundColor = '#e74c3c';
                        el.style.color = 'white';
                    }
                }
            });
        }

        function updateStatus() {
            document.getElementById('bomb-counter').textContent = bombsLeft;
        }

        // Chạy game
        initGame();
    </script>
</body>
</html>
